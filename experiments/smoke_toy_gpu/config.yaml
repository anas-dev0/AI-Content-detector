run: smoke_toy_gpu
seed: 0
splits: configs/splits.yaml
data:
  manifest: C:/aidet_data/toy/toy_manifest.parquet
  shards_root: C:/aidet_data/toy
  tar_index_cache: null
  train_images: null
  val_images: null
  input_size: 224
  geometry: crop
  mean:
  - 0.5
  - 0.5
  - 0.5
  std:
  - 0.5
  - 0.5
  - 0.5
  num_workers: 4
aug:
  hflip: true
  jpeg_p: 0.5
  jpeg_q:
  - 60
  - 100
  blur_p: 0.1
  blur_sigma:
  - 0.1
  - 3.0
model:
  name: vit_tiny_patch16_224
  kwargs:
    drop_path_rate: 0.1
optim:
  lr: 0.0005
  lr_ref_batch: 512
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.999
  warmup_samples: 8000
  clip_grad: 1.0
  label_smoothing: 0.1
  min_lr_ratio: 0.0
train:
  batch_size: 128
  total_samples: 40000
  eval_every_samples: 10000
  ckpt_minutes: 5
  max_minutes: null
  amp: true
  log_every_steps: 20
